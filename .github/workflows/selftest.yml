name: audit-core self-test
# Dogfooding. If this repo is too annoying to gate itself, it is too annoying.
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - name: Validate controls, adapters, rubrics, frameworks
        run: python3 runner/validate.py
      - name: Grounding verifier regression suite
        run: python3 tests/test_grounding.py

      - name: Guard hook regression suite
        run: |
          mkdir -p /tmp/pt/.claude/hooks
          cp templates/claude/hooks/guard.py /tmp/pt/.claude/hooks/
          python3 tests/test_guard.py /tmp/pt

      - name: All runners compile
        run: python3 -m py_compile runner/*.py

      - name: Runner fails closed on a missing config
        run: |
          # Must exit non-zero. A runner that shrugs at a missing config would
          # silently audit nothing and report success.
          if python3 runner/audit.py --config .audit/does-not-exist.yaml; then
            echo "FAIL: runner exited 0 with no config"; exit 1
          fi
          echo "OK: runner refused to run without a config"
