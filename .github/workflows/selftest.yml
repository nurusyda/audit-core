name: audit-core self-test
# Dogfooding. If this repo is too annoying to gate itself, it is too annoying.
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - name: Validate controls, adapters, rubrics, frameworks
        run: python3 runner/validate.py
      - name: Smoke-test the runner
        run: |
          git config user.email ci@test && git config user.name CI
          python3 runner/audit.py --config /dev/null 2>&1 | grep -q "no config" \
            && echo "runner handles a missing config correctly"
