# Architectural decision registry — append-only.
#
# Specs are per-work-item and evaporate once the work ships. Decisions ACCUMULATE.
# This file is what makes "does this clash with what we decided before" answerable,
# instead of depending on whoever happens to remember the conversation.
#
# Rules:
#   - Never delete an entry. Supersede it, so the history stays readable.
#   - `detect` is optional. With it, the decision is enforced mechanically forever at
#     zero cost. Without it, it surfaces for human review in gate A. Both beat memory.
#   - Keep `invariant` to one sentence. If it needs a paragraph, it is two decisions.

decisions: []

